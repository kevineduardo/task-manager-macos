name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test --parallel
      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?"v"\\]?" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Task Manager $version" > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Task Manager ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            dist/*.zip dist/*.dmg dist/SHA256SUMS
